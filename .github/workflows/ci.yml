name: CI

on:
  push:
    branches: [main, prime/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:env
      - run: npm run check:migrations
      - run: npm run check:docs
      - run: npm run test:ingest-core
      - run: npm run build

  smoke-prod-indicator:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check production inflation endpoint
        run: |
          curl -fsS "https://www.adevar.ai/api/indicators/inflation/series?from=2018&to=2025" > /tmp/inflation.json
          python - <<'PY'
          import json
          p = '/tmp/inflation.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          strategy = data.get('matchStrategy')
          count = data.get('count', 0)
          if strategy != 'join-by-slug':
              raise SystemExit(f'FAIL: unexpected strategy={strategy}')
          if not isinstance(count, int) or count <= 0:
              raise SystemExit(f'FAIL: non-positive count={count}')
          print('OK smoke:', {'strategy': strategy, 'count': count})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-inflation-smoke
          path: /tmp/inflation.json

  smoke-prod-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check production health endpoint
        run: |
          curl -fsS "https://www.adevar.ai/api/health" > /tmp/health.json
          python - <<'PY'
          import json
          p = '/tmp/health.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('ok') is not True:
              raise SystemExit(f"FAIL: health not ok -> {data}")
          checks = data.get('checks') or {}
          if (checks.get('inflationPoints') or 0) <= 0:
              raise SystemExit(f"FAIL: inflationPoints invalid -> {checks.get('inflationPoints')}")
          print('OK health smoke:', checks)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-health-smoke
          path: /tmp/health.json

  smoke-prod-dashboard-critical:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check production dashboard critical stats
        run: |
          curl -fsS "https://www.adevar.ai/api/dashboard/stats" > /tmp/dashboard.json
          python - <<'PY'
          import json
          p = '/tmp/dashboard.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          stats = data.get('stats') or {}
          required = ['inflation', 'gas', 'electricity']
          missing = [k for k in required if not isinstance(stats.get(k), dict)]
          if missing:
              raise SystemExit(f"FAIL: missing critical dashboard stats -> {missing}")
          for key in required:
              node = stats[key]
              if not node.get('value'):
                  raise SystemExit(f"FAIL: empty value for {key} -> {node}")
          print('OK dashboard critical smoke:', {k: stats[k].get('value') for k in required})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-dashboard-critical-smoke
          path: /tmp/dashboard.json

  smoke-prod-metadata:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check production inflation metadata fields
        run: |
          curl -fsS "https://www.adevar.ai/api/indicators/inflation/series?from=2018&to=2025" > /tmp/metadata.json
          python - <<'PY'
          import json
          p = '/tmp/metadata.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          indicator = data.get('indicator') or {}
          required = ['name', 'sourceName', 'sourceUrl', 'updateFrequency', 'unit']
          missing = [k for k in required if not indicator.get(k)]
          if missing:
              raise SystemExit(f"FAIL: missing metadata fields -> {missing}")
          print('OK metadata smoke:', {k: indicator.get(k) for k in required})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-metadata-smoke
          path: /tmp/metadata.json

  smoke-prod-ingest:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Check production ingest contract (dry-run)
        run: |
          curl -fsS -X POST "https://www.adevar.ai/api/ingest/indicator-value" \
            -H "content-type: application/json" \
            -d '{"slug":"inflation","year":2025,"value":5.2,"reason":"ci_contract_check","changedBy":"ci","dryRun":true}' \
            > /tmp/ingest.json
          python - <<'PY'
          import json
          p = '/tmp/ingest.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          if data.get('ok') is not True:
              raise SystemExit(f"FAIL: ingest not ok -> {data}")
          if data.get('mode') != 'dry-run':
              raise SystemExit(f"FAIL: expected dry-run mode -> {data.get('mode')}")
          target = data.get('target') or {}
          if not target.get('indicatorId'):
              raise SystemExit(f"FAIL: missing target indicatorId -> {target}")
          print('OK ingest smoke:', target)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prod-ingest-smoke
          path: /tmp/ingest.json
