<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electricity Price — adevar.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── Light tokens (default) ── */
:root{
  --bg:#f5f6f8;--bg2:#ffffff;--bg3:#eaecf1;
  --text:#111318;--text2:#3d4354;--text3:#5f6680;
  --border:#d2d6de;--grid:#e0e3ea;
  --line:#1e3f6e;--line-fill:rgba(30,63,110,0.06);
  --dot:#1e3f6e;--dot-ring:#fff;
  --card-bg:#ffffff;--card-border:#d2d6de;
  --tooltip-bg:rgba(255,255,255,0.97);--tooltip-shadow:0 4px 16px rgba(0,0,0,0.1);
  --accent:#1e3f6e;
  --pdm:#2e5e96;--acum:#787e90;--psrm:#a03636;--pas:#a88300;
  --change-color:#a03636;
}

/* ── Dark tokens ── */
[data-theme="dark"]{
  --bg:#121620;--bg2:#181d2c;--bg3:#212738;
  --text:#e4e7ee;--text2:#a0a6b8;--text3:#7b8298;
  --border:#2e3548;--grid:#282e40;
  --line:#7baade;--line-fill:rgba(123,170,222,0.08);
  --dot:#7baade;--dot-ring:#181d2c;
  --card-bg:#1c2234;--card-border:#2e3548;
  --tooltip-bg:rgba(24,29,44,0.97);--tooltip-shadow:0 4px 16px rgba(0,0,0,0.35);
  --accent:#7baade;
  --pdm:#5a92cc;--acum:#7b8298;--psrm:#d06060;--pas:#d8ae28;
  --change-color:#d06060;
}

body{
  font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
  transition:background .2s ease,color .2s ease;
  -webkit-font-smoothing:antialiased;
}
.container{max-width:920px;margin:0 auto;padding:24px 20px 48px}

/* Header */
.chart-header{margin-bottom:20px}
.chart-header h1{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;letter-spacing:-0.01em}
.chart-header p{font-size:13px;color:var(--text2);line-height:1.4}

/* Controls */
.controls{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:16px}
.ctrl-btn{
  font-family:inherit;font-size:12px;font-weight:500;
  padding:6px 14px;border:1px solid var(--border);border-radius:4px;
  background:var(--card-bg);color:var(--text2);cursor:pointer;
  transition:all 150ms ease;display:inline-flex;align-items:center;gap:4px;
}
.ctrl-btn:hover{border-color:var(--accent);color:var(--text)}
.ctrl-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(30,63,110,0.04)}
[data-theme="dark"] .ctrl-btn.active{background:rgba(123,170,222,0.08)}

/* Stats */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;
  padding:16px;text-align:center;transition:border-color 150ms ease;
}
.stat-card:hover{border-color:var(--accent)}
.stat-label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px}
.stat-value{font-size:28px;font-weight:700;color:var(--text);line-height:1;font-variant-numeric:tabular-nums}
.stat-unit{font-size:11px;color:var(--text2);margin-top:4px}
.stat-card.change .stat-value{color:var(--change-color)}

/* Canvas */
.chart-wrap{
  position:relative;width:100%;background:var(--card-bg);
  border:1px solid var(--card-border);border-radius:6px;
  padding:20px 16px 16px;margin-bottom:16px;
}
canvas{display:block;width:100%;cursor:crosshair}

/* Tooltip */
.tooltip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity 120ms ease;
  background:var(--tooltip-bg);border:1px solid var(--card-border);border-radius:6px;
  padding:12px 16px;font-size:13px;min-width:190px;
  box-shadow:var(--tooltip-shadow);z-index:10;
  backdrop-filter:blur(8px);
}
.tooltip .t-date{font-weight:600;margin-bottom:4px;font-size:13px;color:var(--text)}
.tooltip .t-price{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:8px;font-variant-numeric:tabular-nums}
.tooltip .t-era{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:12px;color:var(--text2)}
.tooltip .t-era .pip{width:8px;height:8px;border-radius:2px;display:inline-block}
.tooltip .t-pm{font-size:12px;color:var(--text3)}

/* Price pill (during animation) */
.price-pill{
  position:absolute;pointer-events:none;opacity:0;
  font-size:16px;font-weight:700;color:var(--accent);
  transition:opacity .2s;font-variant-numeric:tabular-nums;
}

/* Legend */
.legend{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.legend-item .ldot{width:10px;height:10px;border-radius:2px}

/* Events */
.events-section h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.event-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;
  padding:12px 14px;cursor:pointer;transition:border-color 150ms ease;
  display:flex;align-items:flex-start;gap:10px;font-size:13px;
}
.event-card:hover{border-color:var(--accent)}
.event-card .e-pip{width:3px;min-height:28px;border-radius:2px;flex-shrink:0;margin-top:2px}
.event-card .e-label{font-size:11px;color:var(--text2);margin-bottom:2px;font-weight:500}
.event-card .e-text{color:var(--text);line-height:1.4}

@media(max-width:640px){
  .stats-bar{grid-template-columns:repeat(2,1fr)}
  .stat-value{font-size:22px}
  .events-grid{grid-template-columns:1fr}
  .chart-header h1{font-size:17px}
  .container{padding:16px 12px 32px}
}
</style>
</head>
<body>
<div class="container">
  <div class="chart-header">
    <h1 id="chartTitle"></h1>
    <p id="chartSubtitle"></p>
  </div>
  <div class="controls">
    <button class="ctrl-btn" id="replayBtn">&#8635; Replay</button>
    <button class="ctrl-btn" id="speedBtn">1x</button>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="chart-wrap">
    <canvas id="chart"></canvas>
    <div class="tooltip" id="tooltip"></div>
    <div class="price-pill" id="pricePill"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="events-section">
    <h3 id="eventsTitle"></h3>
    <div class="events-grid" id="eventsGrid"></div>
  </div>
</div>

<script>
// ============ CONFIG ============
const CONFIG = {
  unit: 'MDL/kWh',
  yMax: 10,
  gridSteps: 10,
  decimals: 2,
  data: [
    { label:"Q1 2014", value:1.58, era:"PDM", pm:"Iurie Leancă" },
    { label:"Q3 2014", value:1.58, era:"PDM", pm:"Iurie Leancă" },
    { label:"Q1 2015", value:1.58, era:"PDM", pm:"Chiril Gaburici" },
    { label:"Q3 2015", value:1.58, era:"PDM", pm:"Valeriu Streleț" },
    { label:"Q1 2016", value:1.58, era:"PDM", pm:"Gheorghe Brega" },
    { label:"Q3 2016", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q1 2017", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q3 2017", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q1 2018", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q3 2018", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q1 2019", value:1.58, era:"PDM", pm:"Pavel Filip" },
    { label:"Q3 2019", value:1.51, era:"ACUM", pm:"Maia Sandu" },
    { label:"Q4 2019", value:1.51, era:"PSRM", pm:"Ion Chicu" },
    { label:"Q2 2020", value:1.51, era:"PSRM", pm:"Ion Chicu" },
    { label:"Q1 2021", value:1.68, era:"PSRM", pm:"Aureliu Ciocoi" },
    { label:"Q3 2021", value:1.68, era:"PAS", pm:"Natalia Gavrilița" },
    { label:"Q4 2021", value:2.17, era:"PAS", pm:"Natalia Gavrilița" },
    { label:"Q2 2022", value:3.46, era:"PAS", pm:"Natalia Gavrilița" },
    { label:"Q4 2022", value:5.91, era:"PAS", pm:"Natalia Gavrilița" },
    { label:"Q2 2023", value:3.69, era:"PAS", pm:"Dorin Recean" },
    { label:"Q4 2023", value:3.12, era:"PAS", pm:"Dorin Recean" },
    { label:"Q2 2024", value:2.64, era:"PAS", pm:"Dorin Recean" },
    { label:"Q4 2024", value:2.34, era:"PAS", pm:"Dorin Recean" },
    { label:"Q1 2025", value:4.10, era:"PAS", pm:"Dorin Recean" },
    { label:"Q3 2025", value:3.59, era:"PAS", pm:"Dorin Recean" },
    { label:"Q1 2026", value:3.59, era:"PAS", pm:"Alexandru Munteanu" }
  ],
  stats: { current:3.59, lowest:1.51, peak:5.91, change:'+127%' },
  events: [
    { idx:0,  en:"Iasi-Ungheni gas pipeline opens",           ro:"2014: Se deschide gazoductul Iași-Ungheni",        ru:"2014: Открытие газопровода Яссы-Унгены" },
    { idx:2,  en:"Tariff frozen since 2012",                   ro:"2015: Tariful înghețat din 2012",                  ru:"2015: Тариф заморожен с 2012" },
    { idx:4,  en:"$1B bank fraud scandal",                     ro:"2016: Frauda bancară de $1 miliard",               ru:"2016: Банковское мошенничество на $1 млрд" },
    { idx:5,  en:"Plahotniuc consolidates PDM",                ro:"2016: Plahotniuc consolidează PDM",                ru:"2016: Плахотнюк укрепляет ДПМ" },
    { idx:7,  en:"New ANRE tariff methodology",                ro:"2017: Noua metodologie tarifară ANRE",             ru:"2017: Новая тарифная методология ANRE" },
    { idx:9,  en:"IMF requires cost-based tariffs",            ro:"2018: FMI cere tarife bazate pe cost",              ru:"2018: МВФ требует тарифы на основе затрат" },
    { idx:10, en:"Last year of frozen tariff",                 ro:"2019: Ultimul an cu tarif înghețat",               ru:"2019: Последний год с замороженным тарифом" },
    { idx:11, en:"ACUM coalition — slight cut",                ro:"2019: Coaliția ACUM — ușoară reducere",            ru:"2019: Коалиция ACUM — небольшое снижение" },
    { idx:12, en:"PSRM takes power",                          ro:"2019: PSRM preia puterea",                         ru:"2019: ПСРМ приходит к власти" },
    { idx:14, en:"ANRE raises tariff +11%",                    ro:"2021: ANRE majorează tariful +11%",                ru:"2021: ANRE повышает тариф +11%" },
    { idx:15, en:"PAS wins supermajority",                     ro:"2021: PAS câștigă supermajoritate",                ru:"2021: PAS получает суперболь­шинство" },
    { idx:16, en:"Gazprom crisis begins — prices surge",       ro:"2021: Începe criza Gazprom — prețuri în creștere", ru:"2021: Начало кризиса Газпрома — рост цен" },
    { idx:17, en:"Energy crisis peak — tariff doubles",        ro:"2022: Vârful crizei energetice — tariful se dublează", ru:"2022: Пик энергокризиса — тариф удваивается" },
    { idx:18, en:"All-time peak: 5.91 MDL",                    ro:"2022: Vârf istoric: 5.91 MDL",                     ru:"2022: Исторический максимум: 5.91 MDL" },
    { idx:19, en:"Market stabilization begins",                ro:"2023: Începe stabilizarea pieței",                  ru:"2023: Начало стабилизации рынка" },
    { idx:23, en:"Ukraine transit deal expires — 75% spike",   ro:"2025: Expiră acordul de tranzit Ucraina — creștere 75%", ru:"2025: Истекает транзитное соглашение — рост 75%" },
    { idx:24, en:"ANRE approves -12.5% reduction",            ro:"2025: ANRE aprobă reducere -12.5%",                ru:"2025: ANRE одобряет снижение -12.5%" }
  ],
  i18n: {
    ro:{ title:"Prețul Energiei Electrice în Moldova", subtitle:"Tariful pentru consumatori casnici, MDL/kWh (inclusiv TVA)", current:"Actual", lowest:"Minim", peak:"Vârf", change:"Variație", events:"Evenimente cheie", replay:"Reluare" },
    en:{ title:"Electricity Price in Moldova", subtitle:"Household consumer tariff, MDL/kWh (incl. VAT)", current:"Current", lowest:"Lowest", peak:"Peak", change:"Change", events:"Key Events", replay:"Replay" },
    ru:{ title:"Цена на электроэнергию в Молдове", subtitle:"Тариф для бытовых потребителей, MDL/кВтч (включая НДС)", current:"Текущий", lowest:"Минимум", peak:"Пик", change:"Изменение", events:"Ключевые события", replay:"Воспроизвести" }
  }
};

const ERAS = {
  PDM:  { name:'PDM'  },
  ACUM: { name:'ACUM' },
  PSRM: { name:'PSRM' },
  PAS:  { name:'PAS'  }
};

// ============ ENGINE ============
(function(){
  const params = new URLSearchParams(window.location.search);
  let lang = params.get('lang') || 'ro';
  if (!CONFIG.i18n[lang]) lang = 'ro';
  let initialTheme = params.get('theme') || 'light';

  let speed = 1;
  let animProgress = 0;
  let animStart = null;
  let animRunning = false;
  let animDuration = 15000;
  let hoveredIdx = -1;
  let dpr = window.devicePixelRatio || 1;

  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const tooltip = document.getElementById('tooltip');
  const pricePill = document.getElementById('pricePill');
  const data = CONFIG.data;
  const N = data.length;
  const PADDING = { top: 24, right: 32, bottom: 52, left: 56 };

  function eraColor(era) {
    const s = getComputedStyle(document.documentElement);
    const map = { PDM:'--pdm', ACUM:'--acum', PSRM:'--psrm', PAS:'--pas' };
    return s.getPropertyValue(map[era] || '--accent').trim();
  }
  function cssVar(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
  function t(key) { return CONFIG.i18n[lang][key] || key; }
  function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

  function applyTheme(th) {
    document.documentElement.setAttribute('data-theme', th);
    if (!animRunning) render(animProgress);
  }

  function resize() {
    const wrap = canvas.parentElement;
    const w = wrap.clientWidth - 32;
    const h = Math.min(400, Math.max(260, w * 0.45));
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function cw(){return canvas.width/dpr} function ch(){return canvas.height/dpr}
  function plotW(){return cw()-PADDING.left-PADDING.right}
  function plotH(){return ch()-PADDING.top-PADDING.bottom}
  function xPos(i){return PADDING.left+(i/(N-1))*plotW()}
  function yPos(v){return PADDING.top+plotH()-(v/CONFIG.yMax)*plotH()}
  function easeOutCubic(t){return 1-Math.pow(1-t,3)}

  function getPointAtProgress(prog) {
    const idx = prog*(N-1); const i = Math.floor(idx); const frac = idx-i;
    if (i>=N-1) return {x:xPos(N-1),y:yPos(data[N-1].value),idx:N-1};
    return {x:xPos(i)+frac*(xPos(i+1)-xPos(i)),y:yPos(data[i].value+frac*(data[i+1].value-data[i].value)),idx:i};
  }

  function drawEraBands(maxIdx) {
    let startIdx = 0;
    for (let i=0;i<=Math.min(maxIdx,N-1);i++) {
      if (i===Math.min(maxIdx,N-1)||(data[i+1]&&data[i+1].era!==data[i].era)) {
        const c = eraColor(data[i].era);
        const x1=xPos(startIdx),x2=xPos(i);
        ctx.fillStyle = c;
        ctx.globalAlpha = isDark() ? 0.06 : 0.05;
        ctx.fillRect(x1,PADDING.top,x2-x1,plotH());
        ctx.globalAlpha = 1;
        startIdx = i+1;
      }
    }
  }

  function drawGrid() {
    ctx.strokeStyle = cssVar('--grid');
    ctx.lineWidth = 0.5;
    ctx.font = '11px "Inter",sans-serif';
    ctx.fillStyle = cssVar('--text3');
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let i=0;i<=CONFIG.gridSteps;i++) {
      const v=(CONFIG.yMax/CONFIG.gridSteps)*i,y=yPos(v);
      ctx.beginPath(); ctx.moveTo(PADDING.left,y); ctx.lineTo(cw()-PADDING.right,y); ctx.stroke();
      ctx.fillText(v.toFixed(0),PADDING.left-10,y);
    }
    ctx.textAlign='center'; ctx.textBaseline='top';
    const step=Math.max(1,Math.floor(N/8)),labelY=ch()-PADDING.bottom+10;
    let lastX=-Infinity;
    for (let i=0;i<N;i+=step){const x=xPos(i);if(x-lastX>=65){ctx.fillText(data[i].label,x,labelY);lastX=x;}}
    const lx=xPos(N-1);if(lx-lastX>=65)ctx.fillText(data[N-1].label,lx,labelY);
  }

  function drawLine(prog) {
    const drawTo=prog*(N-1),maxI=Math.floor(drawTo),frac=drawTo-maxI;
    const lineColor=cssVar('--line'),fillColor=cssVar('--line-fill');

    // Fill area
    ctx.beginPath(); ctx.moveTo(xPos(0),yPos(0));
    for(let i=0;i<=maxI&&i<N;i++)ctx.lineTo(xPos(i),yPos(data[i].value));
    if(maxI<N-1&&frac>0){const xE=xPos(maxI)+frac*(xPos(maxI+1)-xPos(maxI)),vE=data[maxI].value+frac*(data[maxI+1].value-data[maxI].value);ctx.lineTo(xE,yPos(vE));ctx.lineTo(xE,yPos(0));}
    else ctx.lineTo(xPos(Math.min(maxI,N-1)),yPos(0));
    ctx.closePath(); ctx.fillStyle=fillColor; ctx.fill();

    // Line — no glow, no shadow
    ctx.strokeStyle=lineColor; ctx.lineWidth=2; ctx.lineJoin='round'; ctx.lineCap='round';
    ctx.beginPath();
    for(let i=0;i<=maxI&&i<N;i++){if(i===0)ctx.moveTo(xPos(i),yPos(data[i].value));else ctx.lineTo(xPos(i),yPos(data[i].value));}
    if(maxI<N-1&&frac>0){const xE=xPos(maxI)+frac*(xPos(maxI+1)-xPos(maxI)),vE=data[maxI].value+frac*(data[maxI+1].value-data[maxI].value);ctx.lineTo(xE,yPos(vE));}
    ctx.stroke();

    // Leading dot — solid, no glow
    const pt=getPointAtProgress(prog);
    ctx.beginPath(); ctx.arc(pt.x,pt.y,5,0,Math.PI*2);
    ctx.fillStyle=cssVar('--dot'); ctx.fill();
    ctx.beginPath(); ctx.arc(pt.x,pt.y,2.5,0,Math.PI*2);
    ctx.fillStyle=cssVar('--dot-ring'); ctx.fill();
  }

  function drawCrosshair(idx) {
    if(idx<0||idx>=N)return;
    const x=xPos(idx),y=yPos(data[idx].value);
    ctx.setLineDash([3,3]);
    ctx.strokeStyle=isDark()?'rgba(255,255,255,0.1)':'rgba(0,0,0,0.08)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,PADDING.top);ctx.lineTo(x,PADDING.top+plotH());ctx.stroke();
    ctx.beginPath();ctx.moveTo(PADDING.left,y);ctx.lineTo(cw()-PADDING.right,y);ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fillStyle=eraColor(data[idx].era);ctx.fill();
    ctx.strokeStyle=isDark()?'#1a1f2e':'#fff';ctx.lineWidth=2;ctx.stroke();
  }

  function render(prog) {
    ctx.clearRect(0,0,cw(),ch());
    drawEraBands(Math.floor(prog*(N-1)));
    drawGrid();
    drawLine(prog);
    if(hoveredIdx>=0&&!animRunning)drawCrosshair(hoveredIdx);
  }

  function animLoop(ts) {
    if(!animStart)animStart=ts;
    const raw=Math.min((ts-animStart)/animDuration,1);
    animProgress=easeOutCubic(raw);
    render(animProgress);
    const pt=getPointAtProgress(animProgress),nearIdx=Math.round(animProgress*(N-1));
    if(nearIdx>=0&&nearIdx<N){
      const cr=canvas.getBoundingClientRect(),sx=cr.width/cw(),sy=cr.height/ch();
      pricePill.textContent=data[nearIdx].value.toFixed(CONFIG.decimals)+' '+CONFIG.unit;
      pricePill.style.left=(pt.x*sx-40)+'px';pricePill.style.top=(pt.y*sy-28)+'px';pricePill.style.opacity='1';
    }
    if(raw<1)requestAnimationFrame(animLoop);
    else{animRunning=false;animProgress=1;pricePill.style.opacity='0';render(1);}
  }

  function startAnim(){animStart=null;animRunning=true;animDuration=15000/speed;pricePill.style.opacity='0';requestAnimationFrame(animLoop);}

  function buildStats(){
    const s=CONFIG.stats,bar=document.getElementById('statsBar');
    bar.innerHTML=`
      <div class="stat-card"><div class="stat-label">${t('current')}</div><div class="stat-value">${s.current.toFixed(CONFIG.decimals)}</div><div class="stat-unit">${CONFIG.unit}</div></div>
      <div class="stat-card"><div class="stat-label">${t('lowest')}</div><div class="stat-value">${s.lowest.toFixed(CONFIG.decimals)}</div><div class="stat-unit">${CONFIG.unit}</div></div>
      <div class="stat-card"><div class="stat-label">${t('peak')}</div><div class="stat-value">${s.peak.toFixed(CONFIG.decimals)}</div><div class="stat-unit">${CONFIG.unit}</div></div>
      <div class="stat-card change"><div class="stat-label">${t('change')}</div><div class="stat-value">${s.change}</div><div class="stat-unit">2014 — 2026</div></div>`;
  }

  function buildLegend(){
    document.getElementById('legend').innerHTML=Object.entries(ERAS).map(([k,v])=>
      `<div class="legend-item"><span class="ldot" style="background:${eraColor(k)}"></span>${v.name}</div>`).join('');
  }

  function buildEvents(){
    document.getElementById('eventsTitle').textContent=t('events');
    const grid=document.getElementById('eventsGrid');
    grid.innerHTML=CONFIG.events.map(ev=>{
      const d=data[ev.idx],c=eraColor(d.era),txt=ev[lang]||ev.en;
      return `<div class="event-card" data-idx="${ev.idx}"><div class="e-pip" style="background:${c}"></div><div><div class="e-label">${d.label} · ${ERAS[d.era].name}</div><div class="e-text">${txt}</div></div></div>`;
    }).join('');
    grid.querySelectorAll('.event-card').forEach(card=>{
      card.addEventListener('click',()=>{hoveredIdx=parseInt(card.dataset.idx);animRunning=false;animProgress=1;render(1);showTooltip(hoveredIdx);});
    });
  }

  function showTooltip(idx){
    if(idx<0||idx>=N){tooltip.style.opacity='0';return;}
    const d=data[idx],c=eraColor(d.era),cr=canvas.getBoundingClientRect(),sx=cr.width/cw(),sy=cr.height/ch();
    const px=xPos(idx)*sx,py=yPos(d.value)*sy;
    tooltip.innerHTML=`<div class="t-date">${d.label}</div><div class="t-price">${d.value.toFixed(CONFIG.decimals)} ${CONFIG.unit}</div><div class="t-era"><span class="pip" style="background:${c}"></span>${ERAS[d.era].name}</div><div class="t-pm">PM: ${d.pm}</div>`;
    let left=px+16;if(left+200>cr.width)left=px-210;
    let top=py-20;if(top<0)top=py+20;
    tooltip.style.left=left+'px';tooltip.style.top=top+'px';tooltip.style.opacity='1';
  }

  // Mouse
  canvas.addEventListener('mousemove',e=>{if(animRunning)return;const r=canvas.getBoundingClientRect(),mx=(e.clientX-r.left)/(r.width/cw());let cl=-1,cd=Infinity;for(let i=0;i<N;i++){const d=Math.abs(xPos(i)-mx);if(d<cd){cd=d;cl=i;}}if(cd<30){hoveredIdx=cl;render(1);showTooltip(cl);}else{hoveredIdx=-1;tooltip.style.opacity='0';render(1);}});
  canvas.addEventListener('mouseleave',()=>{hoveredIdx=-1;tooltip.style.opacity='0';if(!animRunning)render(1);});

  // Touch
  canvas.addEventListener('touchstart',e=>{e.preventDefault();ht(e);},{passive:false});
  canvas.addEventListener('touchmove',e=>{e.preventDefault();ht(e);},{passive:false});
  canvas.addEventListener('touchend',()=>{hoveredIdx=-1;tooltip.style.opacity='0';if(!animRunning)render(1);});
  function ht(e){if(animRunning)return;const tc=e.touches[0],r=canvas.getBoundingClientRect(),mx=(tc.clientX-r.left)/(r.width/cw());let cl=-1,cd=Infinity;for(let i=0;i<N;i++){const d=Math.abs(xPos(i)-mx);if(d<cd){cd=d;cl=i;}}if(cd<50){hoveredIdx=cl;render(1);showTooltip(cl);}}

  // Controls
  document.getElementById('replayBtn').addEventListener('click',()=>{hoveredIdx=-1;tooltip.style.opacity='0';startAnim();});
  document.getElementById('speedBtn').addEventListener('click',function(){speed=speed===1?2:1;this.textContent=speed+'x';this.classList.toggle('active',speed===2);});

  // Parent messages
  window.addEventListener('message',e=>{
    if(!e.data)return;
    if(e.data.type==='setTheme')applyTheme(e.data.theme);
    if(e.data.type==='setLang'&&CONFIG.i18n[e.data.lang]){lang=e.data.lang;init();}
  });

  // Height report
  function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:'chartHeight',height:document.body.scrollHeight},'*');}
  const ro=new ResizeObserver(reportHeight);ro.observe(document.body);setTimeout(reportHeight,500);

  function init(){
    document.getElementById('chartTitle').textContent=t('title');
    document.getElementById('chartSubtitle').textContent=t('subtitle');
    document.getElementById('replayBtn').innerHTML='&#8635; '+t('replay');
    resize();buildStats();buildLegend();buildEvents();startAnim();
  }

  window.addEventListener('resize',()=>{dpr=window.devicePixelRatio||1;resize();if(!animRunning)render(animProgress);});

  applyTheme(initialTheme);
  init();
})();
</script>
</body>
</html>
