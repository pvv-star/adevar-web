<style>
/* ============================================================
   ADEVAR.AI — Institutional Data Intelligence Platform
   Design System: 8px grid, WCAG AA, no glow, no neon
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS: LIGHT (default) ── */
:root{
  --bg-primary:#f5f6f8;
  --bg-secondary:#ffffff;
  --bg-tertiary:#eaecf1;
  --border:#d2d6de;
  --border-subtle:#e2e5eb;
  --text-primary:#111318;
  --text-secondary:#3d4354;
  --text-tertiary:#5f6680;
  --text-disabled:#8890a4;
  --accent:#1e3f6e;
  --accent-light:#2c5282;
  --accent-subtle:rgba(30,63,110,0.07);
  --accent-hover:rgba(30,63,110,0.11);
  --nav-active-bg:rgba(30,63,110,0.06);
  --nav-active-border:#1e3f6e;
  --nav-active-text:#1a3a64;
  --cat-heading:#3d4354;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --shadow-md:0 2px 8px rgba(0,0,0,0.07);
  --shadow-overlay:0 4px 24px rgba(0,0,0,0.13);
  --header-bg:rgba(255,255,255,0.94);
  --sidebar-w-expanded:280px;
  --sidebar-w-compact:64px;
  --header-h:56px;
  --bottom-nav-h:0px;
  --transition-fast:150ms ease;
  --transition-normal:200ms ease;
  --radius-sm:4px;
  --radius-md:6px;
}

/* ── TOKENS: DARK ── */
[data-theme="dark"]{
  --bg-primary:#121620;
  --bg-secondary:#181d2c;
  --bg-tertiary:#212738;
  --border:#2e3548;
  --border-subtle:#252b3c;
  --text-primary:#e4e7ee;
  --text-secondary:#a0a6b8;
  --text-tertiary:#7b8298;
  --text-disabled:#586074;
  --accent:#7baade;
  --accent-light:#8db8e8;
  --accent-subtle:rgba(123,170,222,0.1);
  --accent-hover:rgba(123,170,222,0.15);
  --nav-active-bg:rgba(123,170,222,0.09);
  --nav-active-border:#7baade;
  --nav-active-text:#8db8e8;
  --cat-heading:#a0a6b8;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
  --shadow-md:0 2px 8px rgba(0,0,0,0.25);
  --shadow-overlay:0 4px 24px rgba(0,0,0,0.45);
  --header-bg:rgba(18,22,32,0.95);
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg-primary);color:var(--text-primary);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:var(--header-h);
  border-bottom:1px solid var(--border);
  background:var(--header-bg);backdrop-filter:blur(12px);
  position:fixed;top:0;left:0;right:0;z-index:200;
}
.header-left{display:flex;align-items:center;gap:20px}
.header-right{display:flex;align-items:center;gap:12px}

/* Menu toggle */
.nav-toggle{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--text-secondary);cursor:pointer;
  transition:background var(--transition-fast),color var(--transition-fast);
}
.nav-toggle:hover{background:var(--accent-subtle);color:var(--accent)}
.nav-toggle svg{width:18px;height:18px}

/* Brand */
.brand{
  font-weight:700;font-size:18px;letter-spacing:-0.025em;
  color:var(--text-primary);text-decoration:none;
  display:flex;align-items:baseline;gap:0;
  padding-left:4px;
}
.brand-name{color:var(--text-primary);font-weight:800}
.brand-dot{color:var(--accent);margin:0 1px;font-weight:800}
.brand-ext{color:var(--text-secondary);font-weight:500;letter-spacing:0}

/* Language selector */
.lang-group{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.lang-btn{
  font-family:inherit;font-size:11px;font-weight:500;letter-spacing:0.03em;
  padding:4px 10px;border:none;background:transparent;
  color:var(--text-tertiary);cursor:pointer;
  transition:all var(--transition-fast);
}
.lang-btn+.lang-btn{border-left:1px solid var(--border)}
.lang-btn:hover{color:var(--text-primary);background:var(--accent-subtle)}
.lang-btn.active{background:var(--accent);color:#fff;font-weight:600}

/* Theme toggle */
.theme-toggle{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text-secondary);cursor:pointer;
  transition:all var(--transition-fast);
}
.theme-toggle:hover{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent)}
.theme-toggle svg{width:16px;height:16px}

/* ============================================================
   LAYOUT
   ============================================================ */
.layout{display:flex;height:100vh;padding-top:var(--header-h)}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded);
  height:100%;background:var(--bg-secondary);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--transition-normal),min-width var(--transition-normal);
  position:relative;z-index:100;
}
/* Compact mode */
.sidebar.compact{width:var(--sidebar-w-compact);min-width:var(--sidebar-w-compact)}
.sidebar.compact .nav-label,
.sidebar.compact .nav-badge,
.sidebar.compact .cat-label,
.sidebar.compact .sidebar-footer-text{display:none}
.sidebar.compact .nav-item{justify-content:center;padding:10px 0}
.sidebar.compact .nav-item .nav-icon{margin:0}
.sidebar.compact .cat-header{justify-content:center;padding:12px 0 4px}
.sidebar.compact .sidebar-section-title{display:none}

/* Sidebar scroll area */
.sidebar-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Section title */
.sidebar-section-title{
  font-size:10px;font-weight:700;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:0.08em;
  padding:16px 16px 8px;
}

/* Category header */
.cat-header{
  display:flex;align-items:center;gap:8px;
  padding:20px 16px 6px;font-size:10px;font-weight:700;
  color:var(--cat-heading);text-transform:uppercase;letter-spacing:0.08em;
}
.cat-header .cat-icon{font-size:13px;opacity:0.7}
.cat-label{}

/* Nav item */
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;margin:1px 8px;
  border-radius:var(--radius-sm);border-left:3px solid transparent;
  cursor:pointer;font-size:13px;color:var(--text-secondary);
  transition:all var(--transition-fast);text-decoration:none;
  min-width:0;
}
.nav-item:hover{background:var(--accent-subtle);color:var(--text-primary)}
.nav-item.active{
  background:var(--nav-active-bg);color:var(--nav-active-text);
  border-left-color:var(--nav-active-border);font-weight:600;
}
.nav-item .nav-icon{
  font-size:14px;width:20px;text-align:center;flex-shrink:0;opacity:0.7;
}
.nav-item.active .nav-icon{opacity:1}
.nav-item .nav-label{
  /* No truncation — wrap gracefully */
  white-space:normal;word-break:break-word;
  flex:1;line-height:1.35;
}
.nav-item .nav-badge{
  font-size:10px;font-weight:500;
  background:var(--bg-tertiary);color:var(--text-disabled);
  padding:2px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap;
}
/* Soon items: clickable (not greyed out / pointer-events:none) */
.nav-item.soon{opacity:0.65}
.nav-item.soon:hover{opacity:1}

/* Sidebar footer */
.sidebar-footer{
  padding:12px 16px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-disabled);flex-shrink:0;
}
.sidebar-footer a{color:var(--accent);text-decoration:none;font-weight:500}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;
  background:var(--bg-primary);
}

/* Breadcrumb bar */
.content-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-bottom:1px solid var(--border-subtle);
  background:var(--bg-secondary);flex-shrink:0;min-height:48px;
}
.content-title{
  font-size:15px;font-weight:600;color:var(--text-primary);
  display:flex;align-items:center;gap:8px;
}
.content-title .title-icon{font-size:16px;opacity:0.7}
.breadcrumb{
  font-size:12px;color:var(--text-tertiary);
  display:flex;align-items:center;gap:4px;
}
.breadcrumb .sep{opacity:0.5}

/* Chart iframe container */
.chart-viewport{
  flex:1;overflow:hidden;position:relative;
}
.chart-viewport iframe{
  width:100%;height:100%;border:none;display:block;
  background:var(--bg-primary);
}

/* Skeleton loader */
.skeleton-overlay{
  position:absolute;inset:0;background:var(--bg-primary);
  display:flex;flex-direction:column;align-items:center;
  padding:32px;gap:16px;z-index:5;
  transition:opacity .3s ease;
}
.skeleton-overlay.hidden{opacity:0;pointer-events:none}
.skel-bar{
  background:var(--bg-tertiary);border-radius:var(--radius-sm);
  animation:skel-pulse 1.5s ease-in-out infinite;
}
@keyframes skel-pulse{
  0%,100%{opacity:0.5} 50%{opacity:1}
}
.skel-row{display:flex;gap:12px;width:100%;max-width:800px}
.skel-stat{flex:1;height:72px}
.skel-chart{width:100%;max-width:800px;height:320px;margin-top:8px}
.skel-events{width:100%;max-width:800px;height:48px;margin-top:8px}

/* ============================================================
   INLINE VIEWS (dashboard, coming-soon teaser, about)
   ============================================================ */
.view-panel{
  flex:1;overflow-y:auto;padding:32px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  display:none;
}
.view-panel.active{display:block}
.view-panel::-webkit-scrollbar{width:4px}
.view-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* View heading */
.view-heading{
  font-size:20px;font-weight:700;color:var(--text-primary);
  margin-bottom:4px;letter-spacing:-0.02em;
}
.view-subheading{
  font-size:13px;color:var(--text-tertiary);margin-bottom:32px;
}

/* Institutional card */
.inst-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:24px;
  margin-bottom:16px;
}
.inst-card-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.07em;color:var(--text-tertiary);margin-bottom:12px;
}

/* ── DASHBOARD ── */
.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;margin-bottom:32px;
}
.dash-stat-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:20px 24px;cursor:pointer;
  transition:border-color var(--transition-fast),background var(--transition-fast);
}
.dash-stat-card:hover{border-color:var(--accent);background:var(--accent-subtle)}
.dash-stat-label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.07em;color:var(--text-tertiary);margin-bottom:8px;
}
.dash-stat-value{
  font-size:28px;font-weight:700;color:var(--text-primary);
  letter-spacing:-0.03em;line-height:1.1;margin-bottom:6px;
}
.dash-stat-meta{
  font-size:12px;color:var(--text-tertiary);display:flex;
  align-items:center;gap:6px;
}
.dash-stat-change{
  display:inline-flex;align-items:center;gap:2px;
  font-size:12px;font-weight:600;
}
.dash-stat-change.up{color:#1a7a4a}
.dash-stat-change.down{color:#a33}
[data-theme="dark"] .dash-stat-change.up{color:#4db87a}
[data-theme="dark"] .dash-stat-change.down{color:#e06060}

/* Coming-soon grid on dashboard */
.soon-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.soon-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px;
  display:flex;flex-direction:column;gap:6px;
  opacity:0.7;
}
.soon-card-icon{font-size:20px}
.soon-card-name{font-size:12px;font-weight:600;color:var(--text-secondary)}
.soon-badge{
  display:inline-block;font-size:10px;font-weight:600;
  letter-spacing:0.04em;padding:2px 8px;border-radius:10px;
  background:var(--bg-tertiary);color:var(--text-disabled);
  width:fit-content;
}

/* ── COMING SOON TEASER PANEL ── */
.teaser-icon{font-size:40px;margin-bottom:16px}
.teaser-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;letter-spacing:0.06em;
  text-transform:uppercase;padding:4px 12px;border-radius:10px;
  background:var(--bg-tertiary);color:var(--text-disabled);
  border:1px solid var(--border);margin-bottom:16px;
}
.teaser-title{
  font-size:22px;font-weight:700;color:var(--text-primary);
  letter-spacing:-0.02em;margin-bottom:8px;
}
.teaser-desc{
  font-size:14px;color:var(--text-secondary);line-height:1.6;
  max-width:480px;margin-bottom:24px;
}
.teaser-notify-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);background:transparent;
  color:var(--accent);cursor:pointer;
  transition:all var(--transition-fast);
}
.teaser-notify-btn:hover{background:var(--accent);color:#fff}

/* ── ABOUT / METHODOLOGY ── */
.about-section{margin-bottom:32px}
.about-source-list{
  list-style:none;display:flex;flex-direction:column;gap:12px;
}
.about-source-item{
  display:flex;flex-direction:column;gap:2px;
}
.about-source-code{
  font-size:12px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:0.05em;
}
.about-source-name{font-size:13px;color:var(--text-primary);font-weight:500}
.about-source-desc{font-size:12px;color:var(--text-tertiary)}
.about-divider{
  height:1px;background:var(--border-subtle);margin:24px 0;
}

/* ============================================================
   OVERLAY (mobile sidebar)
   ============================================================ */
.sidebar-overlay{
  display:none;position:fixed;inset:0;top:var(--header-h);
  background:rgba(0,0,0,0.3);z-index:90;
  opacity:0;transition:opacity var(--transition-normal);
}
.sidebar-overlay.show{display:block;opacity:1}

/* ============================================================
   BOTTOM NAV (mobile only)
   ============================================================ */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:56px;z-index:200;
  background:var(--header-bg);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.bottom-nav-inner{
  display:flex;align-items:stretch;height:100%;
}
.bn-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-tertiary);font-family:inherit;font-size:10px;font-weight:500;
  transition:color var(--transition-fast);
  padding:0 4px;
}
.bn-tab:hover{color:var(--text-primary)}
.bn-tab.active{color:var(--accent)}
.bn-tab svg{width:20px;height:20px;flex-shrink:0}
.bn-tab-label{white-space:nowrap}

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* Tablet */
@media(max-width:1024px) and (min-width:769px){
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;
    z-index:150;box-shadow:var(--shadow-overlay);
    width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded);
    transform:translateX(calc(-1 * var(--sidebar-w-expanded)));
    transition:transform var(--transition-normal);
    margin-left:0;opacity:1;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar.compact{width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded)}
  .sidebar-overlay.show{display:block;opacity:1}
}

/* Mobile */
@media(max-width:768px){
  :root{--header-h:48px;--bottom-nav-h:56px}
  .header{padding:0 16px;height:48px}
  /* Hide hamburger on mobile — bottom nav handles navigation */
  .header .nav-toggle{display:none}
  .brand{font-size:15px}
  .sidebar{
    position:fixed;top:var(--header-h);left:0;
    bottom:var(--bottom-nav-h);
    z-index:150;box-shadow:var(--shadow-overlay);
    width:280px;min-width:280px;
    transform:translateX(-280px);
    transition:transform var(--transition-normal);
    margin-left:0;opacity:1;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar.compact{width:280px;min-width:280px}
  .sidebar.compact .nav-label,
  .sidebar.compact .nav-badge,
  .sidebar.compact .cat-label,
  .sidebar.compact .sidebar-footer-text{display:initial}
  .sidebar.compact .nav-item{justify-content:flex-start;padding:8px 16px}
  .sidebar.compact .cat-header{justify-content:flex-start;padding:12px 16px 4px}
  .sidebar.compact .sidebar-section-title{display:block}
  .content-header{padding:10px 16px}
  .content-title{font-size:14px}
  .breadcrumb{display:none}
  /* Show bottom nav */
  .bottom-nav{display:block}
  /* Layout accounts for bottom nav */
  .layout{padding-bottom:var(--bottom-nav-h)}
  /* View panel adjusts */
  .view-panel{padding:16px}
  .view-heading{font-size:17px}
  .dash-grid{grid-template-columns:1fr 1fr}
  .soon-grid{grid-template-columns:1fr 1fr}
  /* Sidebar overlay top stays at header-h, bottom stops above bottom-nav */
  .sidebar-overlay{bottom:var(--bottom-nav-h)}
}

@media(min-width:1025px){
  .sidebar-overlay{display:none!important}
  .bottom-nav{display:none!important}
}
</style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>

        <line x1="3" y1="18" x2="18" y2="18"/>
      </svg>
    </button>
    <a class="brand" href="./index.html">
      <span class="brand-name">adevar</span><span class="brand-dot">.</span><span class="brand-ext">ai</span>
    </a>
  </div>
  <div class="header-right">
    <div class="lang-group">
      <button class="lang-btn active" data-lang="ro">RO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ru">RU</button>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── LAYOUT ── -->
<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-scroll" id="sidebarScroll"></div>
    <div class="sidebar-footer">
      <span class="sidebar-footer-text" id="footerText">Surse publice: BNS, ANRE, BNM</span>
    </div>
  </nav>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main">
    <div class="content-header">
      <div class="content-title" id="contentTitle">
        <span class="title-icon" id="titleIcon"></span>
        <span id="titleText">Dashboard</span>
      </div>
      <div class="breadcrumb" id="breadcrumb">
        <span id="bcCategory">adevar.ai</span>
        <span class="sep">/</span>
        <span id="bcItem">Dashboard</span>

    viewDashboard.classList.add('active');

// ── DASHBOARD ──
function renderDashboard() {
  const t = I18N[lang];
  const availCharts = CHARTS.filter(c => c.file && !c.soon && !c.special);
  const soonCharts  = CHARTS.filter(c => c.soon);

  let statsHtml = '';
  availCharts.forEach(c => {
    const stat = LIVE_STATS[c.id];
    if (!stat) return;
    const dirClass = stat.dir === 'up' ? 'up' : 'down';
    const arrow    = stat.dir === 'up'
      ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>'

    statsHtml += `
      <div class="dash-stat-card" role="button" tabindex="0" onclick="selectChart('${c.id}')" onkeydown="if(event.key==='Enter')selectChart('${c.id}')">
        <div class="dash-stat-label">${c[lang]||c.en}</div>
        <div class="dash-stat-value">${stat.value} <span style="font-size:14px;font-weight:500;color:var(--text-tertiary)">${stat.unit}</span></div>
        <div class="dash-stat-meta">
          <span class="dash-stat-change ${dirClass}">${arrow} ${stat.change}</span>
          <span>${t.lastUpdate}: ${stat.date[lang]||stat.date.en}</span>
        </div>
      </div>`;
  });

  let soonHtml = '';
  soonCharts.forEach(c => {
    soonHtml += `
      <div class="soon-card" onclick="selectChart('${c.id}')" role="button" tabindex="0" style="cursor:pointer">
        <div class="soon-card-icon">${c.icon}</div>
        <div class="soon-card-name">${c[lang]||c.en}</div>
        <span class="soon-badge">${t.plannedBadge}</span>
      </div>`;
  });

  viewDashboard.innerHTML = `
    <div class="view-heading" id="dashHeading">${t.dashTitle}</div>
    <div class="view-subheading">${t.dashSub}</div>

    <div class="inst-card">
      <div class="inst-card-title">${t.availableCharts}</div>
      <div class="dash-grid">${statsHtml}</div>
    </div>

    <div class="inst-card">
      <div class="inst-card-title">${t.comingSoon}</div>
      <div class="soon-grid">${soonHtml}</div>
    </div>
  `;
}

            lang==='ro' ? 'Banca Națională a Moldovei' :
            lang==='en' ? 'National Bank of Moldova' :
            'Национальный банк Молдовы'
          }</span>
          <span class="about-source-desc">${
            lang==='ro' ? 'Cursuri valutare, statistici monetare și balanță de plăți. bnm.md' :
            lang==='en' ? 'Exchange rates, monetary statistics, and balance of payments. bnm.md' :
            'Обменные курсы, денежная статистика и платёжный баланс. bnm.md'
          }</span>
        </li>
      </ul>
    </div>

    <div class="inst-card about-section">
      <div class="inst-card-title">${t.methodTitle}</div>
      <p style="font-size:14px;color:var(--text-secondary);line-height:1.7">${t.methodText}</p>
    </div>

    <div class="inst-card about-section">
      <div class="inst-card-title">${t.contactTitle}</div>
      <p style="font-size:14px;color:var(--text-secondary);line-height:1.7">${t.contactText}</p>
    </div>
  `;
}

// ── SIDEBAR ──
function buildSidebar() {
  const t = I18N[lang];
  $('footerText').textContent = t.footer;

  const groups = {};
  CHARTS.forEach(c => {
    if (!groups[c.category]) groups[c.category] = [];
    groups[c.category].push(c);
  });

  let html = '<div class="sidebar-section-title">' + t.overview + '</div>';

  // Main data categories (not 'platform')
  const dataCategories = ['energy','economy','demography','infrastructure'];
  dataCategories.forEach(catId => {
    const cat   = CATEGORIES[catId];
    const items = groups[catId];
    if (!items || !cat) return;
    html += `<div class="cat-header"><span class="cat-label">${cat[lang]||cat.en}</span></div>`;
    items.forEach(c => {
      const label   = c[lang] || c.en;
      const isActive = (activeView==='chart' && activeChart===c.id) ||
                       (activeView==='teaser' && activeChart===c.id);
      const act     = isActive ? ' active' : '';
      const soonCls = c.soon ? ' soon' : '';
      const badge   = c.soon ? `<span class="nav-badge">${t.soon}</span>` : '';
      html += `<div class="nav-item${act}${soonCls}" data-id="${c.id}" role="button" tabindex="0">
        <span class="nav-icon">${c.icon||''}</span>
        <span class="nav-label">${label}</span>
        ${badge}
      </div>`;
    });
  });

  // Platform category at bottom
  html += `<div class="cat-header"><span class="cat-label">${t.platform}</span></div>`;
  const platformItems = groups['platform'] || [];
  platformItems.forEach(c => {
    const label = c[lang] || c.en;
    const isActive = (c.id === 'dashboard' && activeView === 'dashboard') ||
                     (c.id === 'about' && activeView === 'about');
    const act = isActive ? ' active' : '';
    html += `<div class="nav-item${act}" data-id="${c.id}" role="button" tabindex="0">
      <span class="nav-icon">${c.icon||''}</span>
      <span class="nav-label">${label}</span>
    </div>`;
  });

  $('sidebarScroll').innerHTML = html;

  // Bind clicks
  $('sidebarScroll').querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => {
      selectChart(el.dataset.id);
      if (!isDesktop()) closeSidebar();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectChart(el.dataset.id);
        if (!isDesktop()) closeSidebar();
      }
    });
  });
}

// ── CHART / VIEW SELECTION ──
function selectChart(id) {
  const chart = CHARTS.find(c => c.id === id);
  if (!chart) return;

  // Special views
  if (chart.special === 'dashboard') {
    activeChart = null;
    activeView = 'dashboard';
    updateHeader({ icon:'', title: I18N[lang].dashTitle, cat:'adevar.ai', item:I18N[lang].dashTitle });
    renderDashboard();
    showView('dashboard');
    buildSidebar();
    updateBottomNav('dashboard');
    return;
  }
  if (chart.special === 'about') {
    activeChart = 'about';
    activeView = 'about';
    updateHeader({ icon:chart.icon, title:chart[lang]||chart.en, cat:I18N[lang].platform, item:chart[lang]||chart.en });
    renderAbout();
    showView('about');
    buildSidebar();
    return;
  }

  // Coming soon — teaser
  if (chart.soon) {
    activeChart = id;
    const label = chart[lang] || chart.en;
    const cat   = CATEGORIES[chart.category];
    updateHeader({ icon:chart.icon, title:label, cat:cat[lang]||cat.en, item:label });
    renderTeaser(chart);
    showView('teaser');
    buildSidebar();
    updateBottomNavFromCategory(chart.category);
    return;
  }

  // Real chart
  activeChart = id;
  const label = chart[lang] || chart.en;
  const cat   = CATEGORIES[chart.category];
  updateHeader({ icon:chart.icon, title:label, cat:cat[lang]||cat.en, item:label });

  skeleton.classList.remove('hidden');
  frame.src = `./charts/${chart.file}?lang=${lang}&theme=${theme}`;
  showView('chart');
  buildSidebar();
  updateBottomNavFromCategory(chart.category);
}

function updateHeader({icon, title, cat, item}) {
  $('titleIcon').textContent = icon || '';
  $('titleText').textContent = title;
  $('bcCategory').textContent = cat;
  $('bcItem').textContent = item;
}

// ── LANGUAGE ──
function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
  // Update bottom nav labels
  const t = I18N[l];
  $('bnLabelDashboard').textContent = t.bnTabDashboard;
  $('bnLabelEnergy').textContent    = t.bnTabEnergy;
  $('bnLabelEconomy').textContent   = t.bnTabEconomy;
  $('bnLabelMore').textContent      = t.bnTabMore;

  buildSidebar();

  // Re-render current view
  if (activeView === 'dashboard') {
    renderDashboard();
    updateHeader({ icon:'', title:t.dashTitle, cat:'adevar.ai', item:t.dashTitle });
  } else if (activeView === 'about') {
    renderAbout();
    const ac = CHARTS.find(c=>c.id==='about');
    if (ac) updateHeader({ icon:ac.icon, title:ac[l]||ac.en, cat:t.platform, item:ac[l]||ac.en });
  } else if (activeView === 'teaser' && activeChart) {
    const tc = CHARTS.find(c=>c.id===activeChart);
    if (tc) {
      renderTeaser(tc);
      const cat = CATEGORIES[tc.category];
      updateHeader({ icon:tc.icon, title:tc[l]||tc.en, cat:cat[l]||cat.en, item:tc[l]||tc.en });
    }
  } else if (activeView === 'chart' && activeChart) {
    const tc = CHARTS.find(c=>c.id===activeChart);
    if (tc) {
      const cat = CATEGORIES[tc.category];
      updateHeader({ icon:tc.icon, title:tc[l]||tc.en, cat:cat[l]||cat.en, item:tc[l]||tc.en });
      // Re-load iframe with new lang param
      frame.src = `./charts/${tc.file}?lang=${l}&theme=${theme}`;
      skeleton.classList.remove('hidden');
    }
  }
}

// ── NAV TOGGLE ──
function toggleNav() {
  if (isDesktop()) {
    navMode = navMode === 'expanded' ? 'compact' : 'expanded';
    sidebar.classList.toggle('compact', navMode === 'compact');
    try { window['local'+'Storage'].setItem('adevar-nav', navMode); } catch(e){}
  } else {
    const isOpen = sidebar.classList.contains('open');
    if (isOpen) closeSidebar(); else openSidebar();
  }
}

function openSidebar() {
  sidebar.classList.add('open');
  sidebar.classList.remove('off');
  overlay.classList.add('show');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ── BOTTOM NAV ──
function updateBottomNav(view) {
  ['bnDashboard','bnEnergy','bnEconomy','bnMore'].forEach(id => $( id).classList.remove('active'));
  if (view === 'dashboard') $('bnDashboard').classList.add('active');
  else if (view === 'energy') $('bnEnergy').classList.add('active');
  else if (view === 'economy') $('bnEconomy').classList.add('active');
  else if (view === 'more') $('bnMore').classList.add('active');
}

function updateBottomNavFromCategory(cat) {
  if (cat === 'energy') updateBottomNav('energy');
  else if (cat === 'economy') updateBottomNav('economy');
  else updateBottomNav('dashboard');
}

// Navigate to first available chart in category
function navToCategory(cat) {
  if (cat === 'dashboard') {
    selectChart('dashboard');
    return;
  }
  const first = CHARTS.find(c => c.category === cat && c.file && !c.soon);
  if (first) {
    selectChart(first.id);
  } else {
    // Fall back to first chart in category (soon teaser)
    const fallback = CHARTS.find(c => c.category === cat);
    if (fallback) selectChart(fallback.id);
  }
}

// ── EVENTS ──
$('navToggle').addEventListener('click', toggleNav);
overlay.addEventListener('click', closeSidebar);
$('themeToggle').addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

// Iframe loaded → hide skeleton
frame.addEventListener('load', () => {
  setTimeout(() => skeleton.classList.add('hidden'), 200);
  if (frame.contentWindow) {
    try { frame.contentWindow.postMessage({ type:'setTheme', theme }, '*'); } catch(e){}
  }
});

// Bottom nav tab clicks
$('bnDashboard').addEventListener('click', () => {
  navToCategory('dashboard');
  updateBottomNav('dashboard');
  if (sidebar.classList.contains('open')) closeSidebar();
});
$('bnEnergy').addEventListener('click', () => {
  navToCategory('energy');
  updateBottomNav('energy');
  if (sidebar.classList.contains('open')) closeSidebar();
});
$('bnEconomy').addEventListener('click', () => {
  navToCategory('economy');
  updateBottomNav('economy');
  if (sidebar.classList.contains('open')) closeSidebar();
});
$('bnMore').addEventListener('click', () => {
  updateBottomNav('more');
  if (sidebar.classList.contains('open')) {
    closeSidebar();
    // Return active tab highlight to wherever we were
    updateBottomNavFromCategory(activeChart ? (CHARTS.find(c=>c.id===activeChart)||{}).category : 'dashboard');
  } else {
    openSidebar();
  }
});

// Resize handler
window.addEventListener('resize', () => {
  if (isDesktop()) {
    sidebar.classList.remove('open','off');
    overlay.classList.remove('show');
    sidebar.classList.toggle('compact', navMode === 'compact');
  } else if (isTablet()) {
    if (!sidebar.classList.contains('open')) {
      sidebar.classList.remove('compact');
    }
    overlay.classList.remove('show');
  } else {
    if (!sidebar.classList.contains('open')) {
      sidebar.classList.remove('compact');
    }
  }
});

// ── INIT ──
(function init() {
  // Restore theme
  try { const saved = window['local'+'Storage'].getItem('adevar-theme'); if (saved) theme = saved; } catch(e){}
  applyTheme(theme);

  // Restore nav mode
  try { const savedNav = window['local'+'Storage'].getItem('adevar-nav'); if (savedNav) navMode = savedNav; } catch(e){}

  if (isDesktop()) {
    sidebar.classList.toggle('compact', navMode === 'compact');
  }

  // Set bottom nav labels
  const t = I18N[lang];
  $('bnLabelDashboard').textContent = t.bnTabDashboard;
  $('bnLabelEnergy').textContent    = t.bnTabEnergy;
  $('bnLabelEconomy').textContent   = t.bnTabEconomy;
  $('bnLabelMore').textContent      = t.bnTabMore;

  buildSidebar();

  // Default: dashboard view
  selectChart('dashboard');
})();
</script>
</body>
</html>
