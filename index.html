<style>
/* ============================================================
   ADEVAR.AI — Institutional Data Intelligence Platform
   Design System: 8px grid, WCAG AA, no glow, no neon
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS: LIGHT (default) ── */
:root{
  --bg-primary:#f5f6f8;
  --bg-secondary:#ffffff;
  --bg-tertiary:#eaecf1;
  --border:#d2d6de;
  --border-subtle:#e2e5eb;
  --text-primary:#111318;
  --text-secondary:#3d4354;
  --text-tertiary:#5f6680;
  --text-disabled:#8890a4;
  --accent:#1e3f6e;
  --accent-light:#2c5282;
  --accent-subtle:rgba(30,63,110,0.07);
  --accent-hover:rgba(30,63,110,0.11);
  --nav-active-bg:rgba(30,63,110,0.06);
  --nav-active-border:#1e3f6e;
  --nav-active-text:#1a3a64;
  --cat-heading:#3d4354;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.05);
  --shadow-md:0 2px 8px rgba(0,0,0,0.07);
  --shadow-overlay:0 4px 24px rgba(0,0,0,0.13);
  --header-bg:rgba(255,255,255,0.94);
  --sidebar-w-expanded:280px;
  --sidebar-w-compact:64px;
  --header-h:56px;
  --bottom-nav-h:0px;
  --transition-fast:150ms ease;
  --transition-normal:200ms ease;
  --radius-sm:4px;
  --radius-md:6px;
}

/* ── TOKENS: DARK ── */
[data-theme="dark"]{
  --bg-primary:#121620;
  --bg-secondary:#181d2c;
  --bg-tertiary:#212738;
  --border:#2e3548;
  --border-subtle:#252b3c;
  --text-primary:#e4e7ee;
  --text-secondary:#a0a6b8;
  --text-tertiary:#7b8298;
  --text-disabled:#586074;
  --accent:#7baade;
  --accent-light:#8db8e8;
  --accent-subtle:rgba(123,170,222,0.1);
  --accent-hover:rgba(123,170,222,0.15);
  --nav-active-bg:rgba(123,170,222,0.09);
  --nav-active-border:#7baade;
  --nav-active-text:#8db8e8;
  --cat-heading:#a0a6b8;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.25);
  --shadow-md:0 2px 8px rgba(0,0,0,0.25);
  --shadow-overlay:0 4px 24px rgba(0,0,0,0.45);
  --header-bg:rgba(18,22,32,0.95);
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  background:var(--bg-primary);color:var(--text-primary);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ============================================================
   HEADER
   ============================================================ */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:var(--header-h);
  border-bottom:1px solid var(--border);
  background:var(--header-bg);backdrop-filter:blur(12px);
  position:fixed;top:0;left:0;right:0;z-index:200;
}
.header-left{display:flex;align-items:center;gap:20px}
.header-right{display:flex;align-items:center;gap:12px}

/* Menu toggle */
.nav-toggle{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border:none;border-radius:var(--radius-sm);
  background:transparent;color:var(--text-secondary);cursor:pointer;
  transition:background var(--transition-fast),color var(--transition-fast);
}
.nav-toggle:hover{background:var(--accent-subtle);color:var(--accent)}
.nav-toggle svg{width:18px;height:18px}

/* Brand */
.brand{
  font-weight:700;font-size:18px;letter-spacing:-0.025em;
  color:var(--text-primary);text-decoration:none;
  display:flex;align-items:baseline;gap:0;
  padding-left:4px;
}
.brand-name{color:var(--text-primary);font-weight:800}
.brand-dot{color:var(--accent);margin:0 1px;font-weight:800}
.brand-ext{color:var(--text-secondary);font-weight:500;letter-spacing:0}

/* Language selector */
.lang-group{display:flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.lang-btn{
  font-family:inherit;font-size:11px;font-weight:500;letter-spacing:0.03em;
  padding:4px 10px;border:none;background:transparent;
  color:var(--text-tertiary);cursor:pointer;
  transition:all var(--transition-fast);
}
.lang-btn+.lang-btn{border-left:1px solid var(--border)}
.lang-btn:hover{color:var(--text-primary);background:var(--accent-subtle)}
.lang-btn.active{background:var(--accent);color:#fff;font-weight:600}

/* Theme toggle */
.theme-toggle{
  display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:transparent;color:var(--text-secondary);cursor:pointer;
  transition:all var(--transition-fast);
}
.theme-toggle:hover{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent)}
.theme-toggle svg{width:16px;height:16px}

/* ============================================================
   LAYOUT
   ============================================================ */
.layout{display:flex;height:100vh;padding-top:var(--header-h)}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar{
  width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded);
  height:100%;background:var(--bg-secondary);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
  transition:width var(--transition-normal),min-width var(--transition-normal);
  position:relative;z-index:100;
}
/* Compact mode */
.sidebar.compact{width:var(--sidebar-w-compact);min-width:var(--sidebar-w-compact)}
.sidebar.compact .nav-label,
.sidebar.compact .nav-badge,
.sidebar.compact .cat-label,
.sidebar.compact .sidebar-footer-text{display:none}
.sidebar.compact .nav-item{justify-content:center;padding:10px 0}
.sidebar.compact .nav-item .nav-icon{margin:0}
.sidebar.compact .cat-header{justify-content:center;padding:12px 0 4px}
.sidebar.compact .sidebar-section-title{display:none}

/* Sidebar scroll area */
.sidebar-scroll{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.sidebar-scroll::-webkit-scrollbar{width:3px}
.sidebar-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Section title */
.sidebar-section-title{
  font-size:10px;font-weight:700;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:0.08em;
  padding:16px 16px 8px;
}

/* Category header */
.cat-header{
  display:flex;align-items:center;gap:8px;
  padding:20px 16px 6px;font-size:10px;font-weight:700;
  color:var(--cat-heading);text-transform:uppercase;letter-spacing:0.08em;
}
.cat-header .cat-icon{font-size:13px;opacity:0.7}
.cat-label{}

/* Nav item */
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;margin:1px 8px;
  border-radius:var(--radius-sm);border-left:3px solid transparent;
  cursor:pointer;font-size:13px;color:var(--text-secondary);
  transition:all var(--transition-fast);text-decoration:none;
  min-width:0;
}
.nav-item:hover{background:var(--accent-subtle);color:var(--text-primary)}
.nav-item.active{
  background:var(--nav-active-bg);color:var(--nav-active-text);
  border-left-color:var(--nav-active-border);font-weight:600;
}
.nav-item .nav-icon{
  font-size:14px;width:20px;text-align:center;flex-shrink:0;opacity:0.7;
}
.nav-item.active .nav-icon{opacity:1}
.nav-item .nav-label{
  /* No truncation — wrap gracefully */
  white-space:normal;word-break:break-word;
  flex:1;line-height:1.35;
}
.nav-item .nav-badge{
  font-size:10px;font-weight:500;
  background:var(--bg-tertiary);color:var(--text-disabled);
  padding:2px 8px;border-radius:10px;flex-shrink:0;white-space:nowrap;
}
/* Soon items: clickable (not greyed out / pointer-events:none) */
.nav-item.soon{opacity:0.65}
.nav-item.soon:hover{opacity:1}

/* Sidebar footer */
.sidebar-footer{
  padding:12px 16px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text-disabled);flex-shrink:0;
}
.sidebar-footer a{color:var(--accent);text-decoration:none;font-weight:500}

/* ============================================================
   MAIN CONTENT
   ============================================================ */
.main{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;
  background:var(--bg-primary);
}

/* Breadcrumb bar */
.content-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;border-bottom:1px solid var(--border-subtle);
  background:var(--bg-secondary);flex-shrink:0;min-height:48px;
}
.content-title{
  font-size:15px;font-weight:600;color:var(--text-primary);
  display:flex;align-items:center;gap:8px;
}
.content-title .title-icon{font-size:16px;opacity:0.7}
.breadcrumb{
  font-size:12px;color:var(--text-tertiary);
  display:flex;align-items:center;gap:4px;
}
.breadcrumb .sep{opacity:0.5}

/* Chart iframe container */
.chart-viewport{
  flex:1;overflow:hidden;position:relative;
}
.chart-viewport iframe{
  width:100%;height:100%;border:none;display:block;
  background:var(--bg-primary);
}

/* Skeleton loader */
.skeleton-overlay{
  position:absolute;inset:0;background:var(--bg-primary);
  display:flex;flex-direction:column;align-items:center;
  padding:32px;gap:16px;z-index:5;
  transition:opacity .3s ease;
}
.skeleton-overlay.hidden{opacity:0;pointer-events:none}
.skel-bar{
  background:var(--bg-tertiary);border-radius:var(--radius-sm);
  animation:skel-pulse 1.5s ease-in-out infinite;
}
@keyframes skel-pulse{
  0%,100%{opacity:0.5} 50%{opacity:1}
}
.skel-row{display:flex;gap:12px;width:100%;max-width:800px}
.skel-stat{flex:1;height:72px}
.skel-chart{width:100%;max-width:800px;height:320px;margin-top:8px}
.skel-events{width:100%;max-width:800px;height:48px;margin-top:8px}

/* ============================================================
   INLINE VIEWS (dashboard, coming-soon teaser, about)
   ============================================================ */
.view-panel{
  flex:1;overflow-y:auto;padding:32px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  display:none;
}
.view-panel.active{display:block}
.view-panel::-webkit-scrollbar{width:4px}
.view-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* View heading */
.view-heading{
  font-size:20px;font-weight:700;color:var(--text-primary);
  margin-bottom:4px;letter-spacing:-0.02em;
}
.view-subheading{
  font-size:13px;color:var(--text-tertiary);margin-bottom:32px;
}

/* Institutional card */
.inst-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:24px;
  margin-bottom:16px;
}
.inst-card-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.07em;color:var(--text-tertiary);margin-bottom:12px;
}

/* ── DASHBOARD ── */
.dash-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:16px;margin-bottom:32px;
}
.dash-stat-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:20px 24px;cursor:pointer;
  transition:border-color var(--transition-fast),background var(--transition-fast);
}
.dash-stat-card:hover{border-color:var(--accent);background:var(--accent-subtle)}
.dash-stat-label{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:0.07em;color:var(--text-tertiary);margin-bottom:8px;
}
.dash-stat-value{
  font-size:28px;font-weight:700;color:var(--text-primary);
  letter-spacing:-0.03em;line-height:1.1;margin-bottom:6px;
}
.dash-stat-meta{
  font-size:12px;color:var(--text-tertiary);display:flex;
  align-items:center;gap:6px;
}
.dash-stat-change{
  display:inline-flex;align-items:center;gap:2px;
  font-size:12px;font-weight:600;
}
.dash-stat-change.up{color:#1a7a4a}
.dash-stat-change.down{color:#a33}
[data-theme="dark"] .dash-stat-change.up{color:#4db87a}
[data-theme="dark"] .dash-stat-change.down{color:#e06060}

/* Coming-soon grid on dashboard */
.soon-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:12px;
}
.soon-card{
  background:var(--bg-secondary);border:1px solid var(--border);
  border-radius:var(--radius-md);padding:16px;
  display:flex;flex-direction:column;gap:6px;
  opacity:0.7;
}
.soon-card-icon{font-size:20px}
.soon-card-name{font-size:12px;font-weight:600;color:var(--text-secondary)}
.soon-badge{
  display:inline-block;font-size:10px;font-weight:600;
  letter-spacing:0.04em;padding:2px 8px;border-radius:10px;
  background:var(--bg-tertiary);color:var(--text-disabled);
  width:fit-content;
}

/* ── COMING SOON TEASER PANEL ── */
.teaser-icon{font-size:40px;margin-bottom:16px}
.teaser-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11px;font-weight:600;letter-spacing:0.06em;
  text-transform:uppercase;padding:4px 12px;border-radius:10px;
  background:var(--bg-tertiary);color:var(--text-disabled);
  border:1px solid var(--border);margin-bottom:16px;
}
.teaser-title{
  font-size:22px;font-weight:700;color:var(--text-primary);
  letter-spacing:-0.02em;margin-bottom:8px;
}
.teaser-desc{
  font-size:14px;color:var(--text-secondary);line-height:1.6;
  max-width:480px;margin-bottom:24px;
}
.teaser-notify-btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:inherit;font-size:13px;font-weight:600;
  padding:10px 20px;border-radius:var(--radius-sm);
  border:1px solid var(--accent);background:transparent;
  color:var(--accent);cursor:pointer;
  transition:all var(--transition-fast);
}
.teaser-notify-btn:hover{background:var(--accent);color:#fff}

/* ── ABOUT / METHODOLOGY ── */
.about-section{margin-bottom:32px}
.about-source-list{
  list-style:none;display:flex;flex-direction:column;gap:12px;
}
.about-source-item{
  display:flex;flex-direction:column;gap:2px;
}
.about-source-code{
  font-size:12px;font-weight:700;color:var(--accent);
  text-transform:uppercase;letter-spacing:0.05em;
}
.about-source-name{font-size:13px;color:var(--text-primary);font-weight:500}
.about-source-desc{font-size:12px;color:var(--text-tertiary)}
.about-divider{
  height:1px;background:var(--border-subtle);margin:24px 0;
}

/* ============================================================
   OVERLAY (mobile sidebar)
   ============================================================ */
.sidebar-overlay{
  display:none;position:fixed;inset:0;top:var(--header-h);
  background:rgba(0,0,0,0.3);z-index:90;
  opacity:0;transition:opacity var(--transition-normal);
}
.sidebar-overlay.show{display:block;opacity:1}

/* ============================================================
   BOTTOM NAV (mobile only)
   ============================================================ */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  height:56px;z-index:200;
  background:var(--header-bg);
  border-top:1px solid var(--border);
  backdrop-filter:blur(12px);
}
.bottom-nav-inner{
  display:flex;align-items:stretch;height:100%;
}
.bn-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;
  background:transparent;border:none;cursor:pointer;
  color:var(--text-tertiary);font-family:inherit;font-size:10px;font-weight:500;
  transition:color var(--transition-fast);
  padding:0 4px;
}
.bn-tab:hover{color:var(--text-primary)}
.bn-tab.active{color:var(--accent)}
.bn-tab svg{width:20px;height:20px;flex-shrink:0}
.bn-tab-label{white-space:nowrap}

/* ============================================================
   RESPONSIVE
   ============================================================ */
/* Tablet */
@media(max-width:1024px) and (min-width:769px){
  .sidebar{
    position:fixed;top:var(--header-h);left:0;bottom:0;
    z-index:150;box-shadow:var(--shadow-overlay);
    width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded);
    transform:translateX(calc(-1 * var(--sidebar-w-expanded)));
    transition:transform var(--transition-normal);
    margin-left:0;opacity:1;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar.compact{width:var(--sidebar-w-expanded);min-width:var(--sidebar-w-expanded)}
  .sidebar-overlay.show{display:block;opacity:1}
}

/* Mobile */
@media(max-width:768px){
  :root{--header-h:48px;--bottom-nav-h:56px}
  .header{padding:0 16px;height:48px}
  /* Hide hamburger on mobile — bottom nav handles navigation */
  .header .nav-toggle{display:none}
  .brand{font-size:15px}
  .sidebar{
    position:fixed;top:var(--header-h);left:0;
    bottom:var(--bottom-nav-h);
    z-index:150;box-shadow:var(--shadow-overlay);
    width:280px;min-width:280px;
    transform:translateX(-280px);
    transition:transform var(--transition-normal);
    margin-left:0;opacity:1;
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar.compact{width:280px;min-width:280px}
  .sidebar.compact .nav-label,
  .sidebar.compact .nav-badge,
  .sidebar.compact .cat-label,
  .sidebar.compact .sidebar-footer-text{display:initial}
  .sidebar.compact .nav-item{justify-content:flex-start;padding:8px 16px}
  .sidebar.compact .cat-header{justify-content:flex-start;padding:12px 16px 4px}
  .sidebar.compact .sidebar-section-title{display:block}
  .content-header{padding:10px 16px}
  .content-title{font-size:14px}
  .breadcrumb{display:none}
  /* Show bottom nav */
  .bottom-nav{display:block}
  /* Layout accounts for bottom nav */
  .layout{padding-bottom:var(--bottom-nav-h)}
  /* View panel adjusts */
  .view-panel{padding:16px}
  .view-heading{font-size:17px}
  .dash-grid{grid-template-columns:1fr 1fr}
  .soon-grid{grid-template-columns:1fr 1fr}
  /* Sidebar overlay top stays at header-h, bottom stops above bottom-nav */
  .sidebar-overlay{bottom:var(--bottom-nav-h)}
}

@media(min-width:1025px){
  .sidebar-overlay{display:none!important}
  .bottom-nav{display:none!important}
}
</style>
</head>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>

        <line x1="3" y1="18" x2="18" y2="18"/>
      </svg>
    </button>
    <a class="brand" href="./index.html">
      <span class="brand-name">adevar</span><span class="brand-dot">.</span><span class="brand-ext">ai</span>
    </a>
  </div>
  <div class="header-right">
    <div class="lang-group">
      <button class="lang-btn active" data-lang="ro">RO</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ru">RU</button>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ── LAYOUT ── -->
<div class="layout">

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-scroll" id="sidebarScroll"></div>
    <div class="sidebar-footer">
      <span class="sidebar-footer-text" id="footerText">Surse publice: BNS, ANRE, BNM</span>
    </div>
  </nav>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- Main -->
  <div class="main">
    <div class="content-header">
      <div class="content-title" id="contentTitle">
        <span class="title-icon" id="titleIcon"></span>
        <span id="titleText">Dashboard</span>
      </div>
      <div class="breadcrumb" id="breadcrumb">
        <span id="bcCategory">adevar.ai</span>
        <span class="sep">/</span>
        <span id="bcItem">Dashboard</span>

// ── THEME ──
function applyTheme(t) {
  theme = t;

}
function toggleTheme() { applyTheme(theme === 'dark' ? 'light' : 'dark'); }

// ── LANGUAGE ──
function setLang(l) {
  lang = l;

  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));

  renderCurrentView();
}

// ── SIDEBAR ──
function buildSidebar() {
  const t = T[lang];
  const categories = [
    { key:'platform',       label: t.platformLabel },
    { key:'energy',         label: t.energyLabel },
    { key:'economy',        label: t.economyLabel },
    { key:'demography',     label: t.demographyLabel },
    { key:'infrastructure', label: t.infrastructureLabel },
  ];
  const catIcons = { energy:'🔌', economy:'💹', demography:'👥', infrastructure:'🏗️', platform:'' };

  let html = '';
  categories.forEach(cat => {
    const items = CHARTS.filter(c => c.category === cat.key);
    if (!items.length) return;
    html += `<div class="cat-header"><span class="cat-icon">${catIcons[cat.key]}</span><span class="cat-label">${cat.label}</span></div>`;
    items.forEach(ch => {
      const isActive = ch.id === currentChartId;
      const badge = ch.soon ? `<span class="nav-badge">${t.comingSoon}</span>` : '';
      html += `<a class="nav-item${isActive ? ' active' : ''}${ch.soon ? ' soon' : ''}" data-id="${ch.id}" href="#" role="button">
        <span class="nav-icon">${ch.icon}</span>
        <span class="nav-label">${ch[lang]}</span>
        ${badge}
      </a>`;
    });
  });
  return html;
}
function renderSidebar() {
  document.getElementById('sidebarScroll').innerHTML = buildSidebar();
  document.getElementById('footerText').textContent = T[lang].footerText;
  // Re-attach nav click handlers
  document.querySelectorAll('.nav-item[data-id]').forEach(el => {
    el.addEventListener('click', e => { e.preventDefault(); navigateTo(el.dataset.id); });
  });
}

// ── NAVIGATION ──
function navigateTo(id) {
  currentChartId = id;
  const chart = CHARTS.find(c => c.id === id);
  if (!chart) return;

  // Update sidebar
  renderSidebar();

  // Update breadcrumb
  const catLabels = { energy: T[lang].energyLabel, economy: T[lang].economyLabel, demography: T[lang].demographyLabel, infrastructure: T[lang].infrastructureLabel, platform: T[lang].platformLabel };
  document.getElementById('bcCategory').textContent = catLabels[chart.category] || 'adevar.ai';
  document.getElementById('bcItem').textContent = chart[lang];
  document.getElementById('titleText').textContent = chart[lang];
  document.getElementById('titleIcon').textContent = chart.icon;

  // Show correct view
  const viewport = document.getElementById('chartViewport');
  const vDash = document.getElementById('viewDashboard');
  const vTeaser = document.getElementById('viewTeaser');
  const vAbout = document.getElementById('viewAbout');

  // Hide all
  viewport.style.display = 'none';
  vDash.classList.remove('active');
  vTeaser.classList.remove('active');
  vAbout.classList.remove('active');

  if (chart.special === 'dashboard') {
    renderDashboard();
    vDash.classList.add('active');
  } else if (chart.special === 'about') {
    renderAbout();
    vAbout.classList.add('active');
  } else if (chart.soon) {
    renderTeaser(chart);
    vTeaser.classList.add('active');
  } else if (chart.file) {
    const skeleton = document.getElementById('skeleton');
    skeleton.classList.remove('hidden');
    viewport.style.display = '';
    const frame = document.getElementById('chartFrame');
    frame.src = './charts/' + chart.file;
    frame.onload = () => skeleton.classList.add('hidden');
  }

  // Close mobile sidebar
  closeMobileSidebar();

  // Update bottom nav
  updateBottomNav(chart.category);

  // Persist
  localStorage.setItem('lastChart', id);
}

// ── BOTTOM NAV ──
function updateBottomNav(category) {
  document.querySelectorAll('.bn-tab').forEach(t => {
    const view = t.dataset.view;
    const match = (view === 'dashboard' && category === 'platform') ||
                  (view === 'energy' && category === 'energy') ||
                  (view === 'economy' && category === 'economy');
    t.classList.toggle('active', match);
  });
}

// ── MOBILE SIDEBAR ──
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('show');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ── SIDEBAR COMPACT ──
function toggleSidebarCompact() {
  const sidebar = document.getElementById('sidebar');
  const isMobile = window.innerWidth <= 768;
  if (isMobile) {
    // On mobile, toggle open/close
    if (sidebar.classList.contains('open')) {
      closeMobileSidebar();
    } else {
      openMobileSidebar();
    }
    return;
  }
  const isTablet = window.innerWidth <= 1024;
  if (isTablet) {
    if (sidebar.classList.contains('open')) {
      closeMobileSidebar();
    } else {
      openMobileSidebar();
    }
    return;
  }
  sidebarCompact = !sidebarCompact;
  sidebar.classList.toggle('compact', sidebarCompact);
  localStorage.setItem('sidebarCompact', sidebarCompact);
}

// ── DASHBOARD VIEW ──
function renderDashboard() {
  const t = T[lang];
  const available = CHARTS.filter(c => c.file && !c.soon);
  const soon = CHARTS.filter(c => c.soon);

  // Stat cards for available charts
  const statCards = available.map(ch => {
    const meta = getDashMeta(ch.id);
    return `
      <div class="dash-stat-card" onclick="navigateTo('${ch.id}')">
        <div class="dash-stat-label">${ch.icon} ${ch[lang]}</div>
        <div class="dash-stat-value">${meta.value}</div>
        <div class="dash-stat-meta">
          <span class="dash-stat-change ${meta.dir}">${meta.change}</span>
          <span>${meta.period}</span>
        </div>
      </div>`;
  }).join('');

  // Soon grid
  const soonCards = soon.map(ch => `
    <div class="soon-card" onclick="navigateTo('${ch.id}')">
      <div class="soon-card-icon">${ch.icon}</div>
      <div class="soon-card-name">${ch[lang]}</div>
      <div class="soon-badge">${t.comingSoon}</div>
    </div>`).join('');

  document.getElementById('viewDashboard').innerHTML = `
    <div class="view-heading">${t.dashTitle}</div>
    <div class="view-subheading">${t.dashSub}</div>
    <div class="inst-card">
      <div class="inst-card-title">${t.availableNow}</div>
      <div class="dash-grid">${statCards}</div>
    </div>
    <div class="inst-card">
      <div class="inst-card-title">${t.comingSoonSection}</div>
      <div class="soon-grid">${soonCards}</div>
    </div>`;
}

function getDashMeta(id) {
  const metas = {
    gas:         { value:'8.90 MDL/m³',  change:'▼ 0%',   dir:'down', period:'ian 2025' },
    electricity: { value:'2.46 MDL/kWh', change:'▲ +0.4%', dir:'up',   period:'ian 2025' },
    inflation:   { value:'5.2%',         change:'▲ +0.3%', dir:'up',   period:'nov 2024' },
  };
  return metas[id] || { value:'N/A', change:'', dir:'', period:'' };
}

    <div class="inst-card about-section">
      <div class="inst-card-title">${t.methodTitle}</div>
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${t.methodText}</p>
    </div>

    <div class="inst-card about-section">
      <div class="inst-card-title">${t.transparencyTitle}</div>
      <p style="font-size:13px;color:var(--text-secondary);line-height:1.6">${t.transparencyText}</p>
    </div>`;
}

function renderCurrentView() {
  if (!currentChartId) return;
  const chart = CHARTS.find(c => c.id === currentChartId);
  if (!chart) return;
  if (chart.special === 'dashboard') renderDashboard();
  else if (chart.special === 'about') renderAbout();
  else if (chart.soon) renderTeaser(chart);
}

// ── INIT ──
document.getElementById('themeToggle').addEventListener('click', toggleTheme);
document.getElementById('navToggle').addEventListener('click', toggleSidebarCompact);
document.getElementById('sidebarOverlay').addEventListener('click', closeMobileSidebar);
document.querySelectorAll('.lang-btn').forEach(b => {
  b.addEventListener('click', () => setLang(b.dataset.lang));
});

// Bottom nav
document.getElementById('bnDashboard').addEventListener('click', () => navigateTo('dashboard'));
document.getElementById('bnEnergy').addEventListener('click', () => navigateTo('electricity'));
document.getElementById('bnEconomy').addEventListener('click', () => navigateTo('inflation'));
document.getElementById('bnMore').addEventListener('click', () => {
  // Toggle sidebar open on mobile
  const sidebar = document.getElementById('sidebar');
  if (sidebar.classList.contains('open')) { closeMobileSidebar(); } else { openMobileSidebar(); }
});

// Apply saved sidebar compact on desktop
if (window.innerWidth > 1024 && sidebarCompact) {
  document.getElementById('sidebar').classList.add('compact');
}

// Apply saved lang
document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

// Init render
renderSidebar();
const lastChart = localStorage.getItem('lastChart') || 'dashboard';
navigaTo(lastChart);

</script>
</body>
</html>
